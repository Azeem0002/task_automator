[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "task-automator"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "platformdirs>=4.9.4",
    "psutil>=7.2.2",
    "pytimeparse>=1.1.8",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/task_automator"]

[project.scripts]
# Primary product command. ``autoclear`` remains below as a compatibility alias
# for existing users who only use the terminal-clearing feature.
task-automator = "task_automator.cli.controller:main"
autoclear = "task_automator.cli.controller:main"
autoclear-worker = "task_automator.workers.autoclear:main"
scheduled-backup = "task_automator.workers.scheduled_backup:app"
disk-health-monitor = "task_automator.workers.disk_health_monitor:app"
